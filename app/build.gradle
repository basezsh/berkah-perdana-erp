apply plugin: 'com.android.application'

android {
    namespace "com.berkah.erp"
    compileSdk 35

    defaultConfig {
        applicationId "com.berkah.erp"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
}
